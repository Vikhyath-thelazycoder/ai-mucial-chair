schema_version: 1
decisions:
- decision_id: D-001
  date: '2026-10-16'
  kind: architecture
  topic: hosting
  decision: Next.js 15 App Router on Vercel + Supabase cloud (Postgres, Auth, Realtime); no local services
  reason: Every player connects from their own phone over the internet; free tiers; built-in realtime and RLS
  alternatives:
  - Node+Socket.IO on Render
  - Local laptop server
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-002
  date: '2026-10-16'
  kind: architecture
  topic: game-logic-location
  decision: All game state transitions and grading run in Postgres security-definer RPCs; clients only call RPCs and subscribe
    to realtime
  reason: Single source of truth, atomic chair claims under concurrency, answers never reach clients
  alternatives:
  - Next.js API routes holding state
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-003
  date: '2026-10-16'
  kind: architecture
  topic: surfaces
  decision: 'One deployment with three routes: /admin, /play, /screen (projector = another Chrome tab)'
  reason: Shared types and auth, one deploy; user confirmed projector is just a tab
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-004
  date: '2026-10-16'
  kind: security
  topic: answer-secrecy
  decision: questions.answer and attempts.is_correct are never readable by player or screen roles; grading is server-side
    with server timestamps
  reason: Players must not learn correctness or answers; prevents client-side tampering of times
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-005
  date: '2026-10-16'
  kind: security
  topic: chair-qr
  decision: Chair QR encodes chair id + random secret; claim accepted only for an authenticated active player during scan_open
    phase, once per spin per chair and per player
  reason: Stops unregistered scans, photo-of-QR scans before music stops, and double claims
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-006
  date: '2026-10-16'
  kind: security
  topic: anti-cheat
  decision: 'Browser-level deterrence only: fullscreen, no select/copy/context menu, name watermark, visibility/blur/pagehide
    alerts to admin; admin decides penalty'
  reason: A web page cannot block screenshots or second devices; honest scope agreed with user
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-007
  date: '2026-10-16'
  kind: architecture
  topic: music
  decision: Spotify Web Playback SDK + Web API (PKCE) in admin on desktop Chrome, with a manual 'Music stopped' fallback button
  reason: User choice; Premium required; fallback keeps the game running if Spotify fails
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-008
  date: '2026-10-16'
  kind: architecture
  topic: ai-questions
  decision: Gemini API via @google/genai from a server route only; generated questions are reviewed by the admin before saving
  reason: User has a Gemini key, not Claude; LLM output is untrusted and must be validated and reviewed
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-009
  date: '2026-10-16'
  kind: design
  topic: visual-direction
  decision: Dark neon arcade with 3D (React Three Fiber, drei, postprocessing bloom), Framer Motion, GSAP; custom chair/trophy
    GLBs modelled via Blender MCP; low-power 2D fallback on player phones
  reason: User wants a modern 3D game feel; phones must stay fast during scanning
  alternatives: []
  impact: ''
  supersedes: null
  status: SUPERSEDED
  tags: []
- decision_id: D-010
  date: '2026-10-16'
  kind: product
  topic: ranking
  decision: Players who hold the last 3 chairs are the winners; podium order by correct-answer time in the final round
  reason: 'User: luck decides, no points system'
  alternatives: []
  impact: ''
  supersedes: null
  status: SUPERSEDED
  tags: []
- decision_id: D-011
  date: '2026-10-16'
  kind: product
  topic: admin-configurable-counts
  decision: Chair count, player count, per-round chair schedule and final-round count are all set by the admin at runtime;
    chairs can be added/deleted/toggled any number between spins; no fixed sequence
  reason: 'User: the admin can add or delete anything; 10/15 and 10→8→6→4→3 were only examples'
  alternatives: []
  impact: ''
  supersedes: D-010
  status: ACTIVE
  tags: []
- decision_id: D-012
  date: '2026-10-16'
  kind: product
  topic: ranking
  decision: Players holding the chairs of the final round are the winners; podium order by correct-answer time in the final
    round
  reason: 'User: luck decides, no points system (re-records D-010, superseded by mistake)'
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-013
  date: '2026-10-16'
  kind: architecture
  topic: db-testing
  decision: Database security and RPC tests run as Vitest integration tests using supabase-js against the aimc-test cloud
    project (real auth users per role), instead of pgTAP
  reason: pgTAP via supabase test db needs local Docker; black-box tests through the public API exercise RLS and grants exactly
    as attackers would
  alternatives:
  - pgTAP with Docker
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-014
  date: '2026-10-16'
  kind: product
  topic: game-sessions
  decision: 'Games run as sessions: the admin''s ''New game'' ends the current session (terminating any round in progress)
    and opens a fresh lobby; players belong to one session and must register again for the next one; chairs and their QR codes
    are permanent across sessions; past sessions'' results are kept'
  reason: Several teams play back to back at the fest; reprinting or re-pasting QR codes between teams is impractical and
    error-prone
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-015
  date: '2026-10-16'
  kind: security
  topic: player-account-creation
  decision: Player auth accounts are created server-side by the player-signup Supabase Edge Function (admin createUser, pre-confirmed,
    synthetic USN email); the browser then signs in with USN + PIN. The service key stays inside Supabase (auto-injected),
    never in Vercel or the client
  reason: 'Browser signUp sends a confirmation email (free tier: 2 emails/hour) and rejects the synthetic domain; server-side
    creation needs no email and avoids per-IP sign-up limits on shared campus WiFi'
  alternatives:
  - Next.js route with service key on Vercel
  - Anonymous sign-in (30/hour per IP)
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-016
  date: '2026-10-16'
  kind: product
  topic: who-is-playing
  decision: Registration doesn't put a player in the game; scanning a chair does. Anyone registered can play round 1 (late
    registrations during round 1 are active); after round 1 only its chair holders continue, later registrations are spectators.
    Admin sees who is in play from live scans (name, USN, chair)
  reason: 'User: people register freely; the real roster is whoever sits and scans in round 1'
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-017
  date: '2026-10-17'
  kind: architecture
  topic: 3d-assets
  decision: Blender GLBs (public/models/chair.glb, podium.glb) ship uncompressed, without Draco
  reason: Low-poly models are 34 KB and 137 KB; a Draco decoder adds ~300 KB of wasm, an external decoder host and CSP 'wasm-unsafe-eval'
    for no real saving
  alternatives:
  - Draco compression with a self-hosted decoder
  impact: T-701 acceptance (< 1 MB, loads via useGLTF) met without Draco
  supersedes: null
  status: SUPERSEDED
  tags: []
- decision_id: D-018
  date: '2026-10-17'
  kind: architecture
  topic: screen-motion
  decision: Projector sequences use motion (2D overlays) and react-three-fiber useFrame easing (3D); confetti is an instanced
    three.js particle burst
  reason: Both libraries are already in the bundle; GSAP and canvas-confetti would add dependencies for effects these cover
  alternatives:
  - GSAP timelines + canvas-confetti as listed in DESIGN.md Motion
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-019
  date: '2026-10-17'
  kind: architecture
  topic: 3d-assets
  decision: 'Realistic PBR models from Blender: walnut + leather chair (707 KB), lacquer/marble/gold podium with separate
    Trophy node (595 KB); procedural materials baked to WebP colour/roughness/normal maps; no Draco'
  reason: User asked for ultra-realistic visuals; baked WebP textures keep each GLB under 1 MB, and skipping Draco avoids
    a wasm decoder plus CSP wasm-unsafe-eval
  alternatives:
  - Stylised neon models; Draco/meshopt compression
  impact: ''
  supersedes: D-017
  status: ACTIVE
  tags: []
- decision_id: D-020
  date: '2026-10-17'
  kind: design
  topic: 3d-fallback
  decision: Home page, player status ring and projector always show the realistic 3D chairs; the 2D chair fallback and neon
    chair are removed. Slow devices drop to low quality (no mirrored floor or bloom); reduced motion stops the turning
  reason: User wants the realistic 3D everywhere and no 2D chairs
  alternatives:
  - Keep the low-power 2D fallback
  impact: Phones download three.js + chair.glb (~0.7 MB) lazily on the home and status screens; scanner and question screens
    still load no 3D
  supersedes: D-009
  status: ACTIVE
  tags: []
